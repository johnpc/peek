name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  SCHEME: peek
  DESTINATION: "platform=iOS Simulator,name=iPhone 17 Pro"

jobs:
  gates:
    name: Build · Unit Tests · Coverage · CRAP · Acceptance
    # Self-hosted Mac mini. This workflow runs on pull_request too, and
    # self-hosted runners on a public repo are unsafe for fork PRs (arbitrary
    # code execution) — so only run for push-to-main or a PR authored by the
    # repo owner. One job on purpose: the runner executes jobs serially, so
    # splitting them only added checkouts and DerivedData cache round-trips.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'johnpc'
    runs-on: [self-hosted, mac-mini]
    timeout-minutes: 30
    env:
      # Persistent on the runner: incremental builds + cached package checkouts
      # across runs (the workspace itself is re-checked-out every time).
      DERIVED: /Users/john/peek-ci/derived
      SPM: /Users/john/peek-ci/spm
    steps:
      - uses: actions/checkout@v5

      - name: Enforce 100-line limit on all source files
        run: bash scripts/check_file_lines.sh

      - name: Verify generated acceptance tests match .feature files
        run: python3 scripts/generate_acceptance_tests.py --check

      - name: Invalidate the persistent build cache when the project file changes
        run: |
          # Incremental DerivedData survives target/phase changes badly (stale
          # test hosts, missing embedded frameworks). Key it on the pbxproj.
          mkdir -p "$DERIVED" "$SPM"
          STAMP="$DERIVED/../pbxproj.sha"
          NEW=$(shasum -a 256 peek.xcodeproj/project.pbxproj | cut -d' ' -f1)
          if [ "$(cat "$STAMP" 2>/dev/null)" != "$NEW" ]; then
            echo "project file changed — clearing $DERIVED"
            rm -rf "$DERIVED"
            mkdir -p "$DERIVED"
            echo "$NEW" > "$STAMP"
          fi

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED" \
            -clonedSourcePackagesDirPath "$SPM" \
            -quiet

      - name: Unit tests + coverage
        run: |
          rm -rf TestResults.xcresult
          xcodebuild test-without-building \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED" \
            -only-testing:"peekTests" \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            -quiet
          xcrun xccov view --report --json TestResults.xcresult > coverage.json

      - name: Enforce coverage >= 80%
        run: python3 scripts/coverage_check.py coverage.json

      - name: CRAP scores (threshold 15)
        run: python3 scripts/crap_check.py coverage.json

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage.json

      - name: Acceptance scenarios on parallel simulators
        run: |
          # Xcode clones the simulator and spreads the per-feature test classes
          # across workers. Only a failing test is retried (a flake that passes
          # on retry passes; a real failure fails every iteration).
          rm -rf AcceptanceResults.xcresult
          xcodebuild test-without-building \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED" \
            -only-testing:peekUITests \
            -parallel-testing-enabled YES \
            -parallel-testing-worker-count 4 \
            -retry-tests-on-failure \
            -test-iterations 3 \
            -resultBundlePath AcceptanceResults.xcresult \
            -quiet

      - name: Summarize acceptance failures
        if: failure()
        run: |
          [ -d AcceptanceResults.xcresult ] && xcrun xcresulttool get test-results summary --path AcceptanceResults.xcresult \
            | python3 -c "import json,sys; [print(f'❌ {f[\"testIdentifierString\"]}: {f[\"failureText\"]}') for f in json.load(sys.stdin).get('testFailures', [])]" || true

  deploy:
    name: Deploy to App Store Connect
    runs-on: [self-hosted, mac-mini]
    timeout-minutes: 60
    needs: gates
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - name: Write App Store Connect API key
        run: |
          # Per-job $RUNNER_TEMP, not the shared ~/private_keys: other apps' deploys on the mini use the same key file and our cleanup would delete it mid-export.
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "${{ secrets.ASC_KEY_CONTENT }}" > "$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"

      - name: Increment build number
        run: |
          BUILD_NUM=$(date +%Y%m%d%H%M)
          agvtool new-version -all $BUILD_NUM

      - name: Unlock CI signing keychain
        env:
          CI_KEYCHAIN_PASSWORD: ${{ secrets.CI_KEYCHAIN_PASSWORD }}
        run: |
          # ci-signing.keychain-db is on the mini's search list for other apps'
          # deploys; left locked, codesign finds its Apple Distribution identity
          # and waits forever for a password prompt. Unlock it in the daemon
          # context and in the user session the export runs in.
          security unlock-keychain -p "$CI_KEYCHAIN_PASSWORD" "$HOME/Library/Keychains/ci-signing.keychain-db"
          sudo -n launchctl asuser "$(id -u)" sudo -n -u "$(id -un)" env HOME="$HOME" \
            security unlock-keychain -p "$CI_KEYCHAIN_PASSWORD" "$HOME/Library/Keychains/ci-signing.keychain-db"

      - name: Archive and upload (auto-bump version on conflict)
        # A signing hang must fail fast, not hold the heavy lane for the job's hour.
        timeout-minutes: 20
        run: |
          # Export options, archive and export dir live in the per-job $RUNNER_TEMP: fixed /tmp and ~/Desktop paths get overwritten by other apps' concurrent deploys on the mini.
          cat > "$RUNNER_TEMP/ExportOptions.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>upload</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>teamID</key>
              <string>${{ secrets.TEAM_ID }}</string>
          </dict>
          </plist>
          PLIST

          archive_and_upload() {
            # Archive unsigned: the runner is a LaunchDaemon (no user security
            # session), where Xcode can't install a signing certificate into
            # any keychain. The export below signs with Apple's cloud-managed
            # distribution certificate instead, which needs no local key.
            xcodebuild archive \
              -scheme "$SCHEME" \
              -destination "generic/platform=iOS" \
              -derivedDataPath /Users/john/peek-ci/derived \
              -clonedSourcePackagesDirPath /Users/john/peek-ci/spm \
              -archivePath "$RUNNER_TEMP/peek.xcarchive" \
              CODE_SIGNING_ALLOWED=NO \
              -quiet

            # Run the export inside the logged-in user's session: from the runner's
            # LaunchDaemon context, xcodebuild crashes (SIGTRAP in AppSSO/XPC,
            # xpc_connection_set_target_uid misuse) while fetching the app record.
            sudo -n launchctl asuser "$(id -u)" sudo -n -u "$(id -un)" env HOME="$HOME" \
            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/peek.xcarchive" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
              -exportPath "$RUNNER_TEMP/export" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
              -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
              -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} 2>&1
          }

          # Capture for the conflict check below, but always show the full
          # output in the job log — a swallowed error here cost us a run.
          set +e
          OUTPUT=$(archive_and_upload 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"
          echo "archive/export exit status: $STATUS"
          [ "$STATUS" -eq 0 ] && exit 0

          if echo "$OUTPUT" | grep -q "Error Downloading App Information"; then
            # The archive built and signed; App Store Connect just has no app
            # record for this bundle id yet (the record can't be created by
            # API). Not a code failure — surface it and let the run stay green.
            echo "::warning title=TestFlight upload skipped::No App Store Connect app record exists for com.johncorser.peek yet. Create the app in App Store Connect (bundle id com.johncorser.peek); the next push to main will upload."
            exit 0
          fi

          if echo "$OUTPUT" | grep -qi "version.*already exists\|already been uploaded\|redundant binary\|train.*closed\|higher version"; then
            echo "⚠️ Version conflict detected, bumping minor version..."
            CURRENT=$(grep 'MARKETING_VERSION' peek.xcodeproj/project.pbxproj | head -1 | sed 's/.*= *\(.*\);/\1/')
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            NEW_VERSION="${MAJOR}.$((MINOR + 1))"
            sed -i '' "s/MARKETING_VERSION = ${CURRENT}/MARKETING_VERSION = ${NEW_VERSION}/g" peek.xcodeproj/project.pbxproj
            echo "Bumped $CURRENT → $NEW_VERSION"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Bump version to $NEW_VERSION [skip ci]"
            git push

            rm -rf "$RUNNER_TEMP/peek.xcarchive" "$RUNNER_TEMP/export"
            archive_and_upload
          else
            exit 1
          fi

      - name: Remove signing material
        if: always()
        run: |
          # Self-hosted: nothing is wiped between jobs, so don't leave the ASC
          # key or the archive on the Mac Mini. Only this job's $RUNNER_TEMP
          # copies — never the shared ~/private_keys other apps' deploys read.
          rm -f "$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" "$RUNNER_TEMP/ExportOptions.plist"
          rm -rf "$RUNNER_TEMP/peek.xcarchive" "$RUNNER_TEMP/export"
